workflows:
  ios-build:
    name: macielfilza iOS build
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
      tag_patterns:
        - pattern: build-*
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Validate source bundle and patch resources
        script: |
          set -euo pipefail
          echo "=== checkout ==="
          git rev-parse HEAD
          if [ -f BYPASS7-PROXY-FULL-SOURCE.zip ]; then
            echo "Extracting full source bundle"
            unzip -q -o BYPASS7-PROXY-FULL-SOURCE.zip
          fi
          test -f ThreeOneOSFive.xcodeproj/project.pbxproj
          test -f ThreeOneOSFive/App.swift
          test -f ThreeOneOSFive/AuthenticationViewModel.swift
          test -f ThreeOneOSFive/views/LoginView.swift
          test -f ThreeOneOSFive/helpers/PatchPackageCodec.swift
          grep -Fq 'AuthenticatedRootView(viewModel: authViewModel)' ThreeOneOSFive/App.swift
          grep -Fq 'seedBundledPatchesIfNeeded' ThreeOneOSFive/helpers/PatchProjectLibrary.swift
          grep -Fq 'seedBundledPatchesIfNeeded()' ThreeOneOSFive/helpers/PatchProjectStore.swift
          grep -Fq 'Text("CRIADOR MACIEL FILZA")' ThreeOneOSFive/ContentView.swift
          grep -Fq 'private struct CreatorBannerText: View' ThreeOneOSFive/ContentView.swift
          grep -Fq '.yellow' ThreeOneOSFive/ContentView.swift
          ! grep -Fq 'MENU FULL FUNCTION' ThreeOneOSFive/ContentView.swift
          ! grep -Fq 'menuFullFunctionID' ThreeOneOSFive/ContentView.swift
          grep -Fq 'synchronizesWorkspaceBeforeApply: false' ThreeOneOSFive/ContentView.swift
          grep -Fq 'displayName: "AIMBOT + ESP(SAFE)"' ThreeOneOSFive/ContentView.swift
          grep -Fq 'id: "aimbot-esp-safe",' ThreeOneOSFive/ContentView.swift
          grep -Fq 'private var titleGradient: LinearGradient' ThreeOneOSFive/ContentView.swift
          grep -Fq 'repeatForever(autoreverses: false)' ThreeOneOSFive/ContentView.swift
          grep -Fq 'accessibilityReduceMotion' ThreeOneOSFive/ContentView.swift
          grep -Fq 'Text("macielfilza")' ThreeOneOSFive/ContentView.swift
          grep -Fq 'static let accent = Color(red: 0.93, green: 0.0, blue: 0.0)' ThreeOneOSFive/views/DesignSystem.swift
          grep -Fq 'static let onAccent = Color.black' ThreeOneOSFive/views/DesignSystem.swift
          grep -Fq '.red' ThreeOneOSFive/ContentView.swift
          grep -Fq '.green' ThreeOneOSFive/ContentView.swift
          grep -Fq '.orange' ThreeOneOSFive/ContentView.swift
          ! grep -Fq 'Label("Discord"' ThreeOneOSFive/views/LoginView.swift
          ! grep -Fq 'discord.gg/' ThreeOneOSFive/views/LoginView.swift
          ! grep -Fq 'Image("Bypass7Logo")' ThreeOneOSFive/ContentView.swift
          ! grep -Fq 'Image("Bypass7Logo")' ThreeOneOSFive/views/LoginView.swift
          test ! -e ThreeOneOSFive/Assets.xcassets/Bypass7Logo.imageset
          grep -Fq 'Os seis patches incluídos' ThreeOneOSFive/ContentView.swift
          grep -Fq 'Label("Abrir patches", systemImage: "scope")' ThreeOneOSFive/ContentView.swift
          ! grep -Fq 'Abrir biblioteca de patches' ThreeOneOSFive/ContentView.swift
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from plistlib import loads
          root = Path('ThreeOneOSFive/Resources/OfficialPatches')
          expected = {
              'HS CEARENSE.3105',
              'HS GIRAFA.3105',
              'HS PESCOÇO + ANTENA.3105',
              'HS PEITO + ANTENA.3105',
              '144 FPS FFTH.3105',
              'AIMBOT + ESP(SAFE).3105',
          }
          actual = {p.name for p in root.glob('*.3105')}
          if actual != expected:
              raise SystemExit(f'Unexpected patch set: missing={expected-actual}, extra={actual-expected}')
          package_ids = set()
          for path in sorted(root.glob('*.3105')):
              raw = path.read_bytes()
              magic = b'3105PATCH\0'
              if not raw.startswith(magic):
                  raise SystemExit(f'Bad package signature: {path.name}')
              env = loads(raw[len(magic):])
              package_id = env.get('packageID')
              if not isinstance(package_id, str) or package_id in package_ids:
                  raise SystemExit(f'Missing or duplicate package ID: {path.name} ({package_id})')
              package_ids.add(package_id)
              if env['isPasswordProtected'] or not (1 <= env['schemaVersion'] <= 3):
                  raise SystemExit(f'Unexpected package version/protection: {path.name}')
              key = env.get('publicContentKey', b'')
              if len(key) != 32 or sha256(key).digest() != env['keyFingerprint']:
                  raise SystemExit(f'Invalid package key fingerprint: {path.name}')
              print(f"validated envelope: {path.name} (schema {env['schemaVersion']})")
          if len(package_ids) != len(expected):
              raise SystemExit(f'Expected {len(expected)} unique package IDs, found {len(package_ids)}')
          aimbot_esp_package = (root / 'AIMBOT + ESP(SAFE).3105').read_bytes()
          if len(aimbot_esp_package) < 28:
              raise SystemExit('AIMBOT + ESP(SAFE) package is truncated')
          if (root / 'ASSEMBLY + LOCAL CONFIG.3105').exists():
              raise SystemExit('Removed Assembly + Local Config package is still bundled')
          PY
          echo "Source and patch envelope validation passed."
      - name: Clean previous outputs
        script: |
          set -euo pipefail
          rm -rf build-clean artifacts clean.log build.log
      - name: Build unsigned Release app
        script: |
          set -euo pipefail
          DERIVED_DATA=build-clean
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            VALIDATE_PRODUCT=YES \
            clean 2>&1 | tee clean.log
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            VALIDATE_PRODUCT=YES \
            build 2>&1 | tee build.log
      - name: Package and verify unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH=$(find build-clean/Build/Products -maxdepth 3 -type d -name '*.app' | head -n 1)
          test -n "$APP_PATH" && test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH"
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")
          echo "DISPLAY_NAME=$DISPLAY_NAME"
          echo "EXECUTABLE=$EXECUTABLE"
          echo "VERSION=$VERSION"
          echo "BUILD_NUMBER=$BUILD_NUMBER"
          test "$DISPLAY_NAME" = 'macielfilza'
          test -n "$EXECUTABLE"
          test -f "$APP_PATH/$EXECUTABLE"
          test "$VERSION" = '2.0'
          test "$BUILD_NUMBER" = '8.12'
          for resource in \
            'HS CEARENSE.3105' \
            'HS GIRAFA.3105' \
            'HS PESCOÇO + ANTENA.3105' \
            'HS PEITO + ANTENA.3105' \
            '144 FPS FFTH.3105' \
            'AIMBOT + ESP(SAFE).3105'; do
            test -f "$APP_PATH/OfficialPatches/$resource" || {
              echo "ERROR: missing bundled resource: OfficialPatches/$resource" >&2
              exit 1
            }
            echo "bundled resource: $resource"
          done
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/
          test -f "artifacts/Payload/$(basename "$APP_PATH")/Info.plist"
          (cd artifacts && zip -qry macielfilza.ipa Payload)
          unzip -tq artifacts/macielfilza.ipa
    artifacts:
      - artifacts/macielfilza.ipa
      - build-clean/Build/Products/**/*.app
      - build-clean/Build/Products/**/*.dSYM
      - clean.log
      - build.log
